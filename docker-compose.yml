services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dental_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - dental_network

  nginx:
    image: nginx:alpine
    container_name: dental_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dental_network

  db:
    image: postgres:16-alpine
    container_name: dental_db
    environment:
      POSTGRES_DB: dental_hub
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    networks:
      - dental_network

  redis:
    image: redis:alpine
    container_name: dental_redis
    networks:
      - dental_network

networks:
  dental_network:
    driver: bridge